<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #ecebe5;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="34"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.9"
        data-track-index="0"
      ></div>

      <div
        id="el-02-intro"
        class="scene"
        data-composition-id="02-intro"
        data-composition-src="compositions/frames/02-intro.html"
        data-start="4"
        data-duration="5.9"
        data-track-index="1"
      ></div>

      <div
        id="el-03-ritual"
        class="scene"
        data-composition-id="03-ritual"

      <div

      <div
        id="el-06-qualities"
        class="scene"
        data-composition-id="06-qualities"
        data-composition-src="compositions/frames/06-qualities.html"

      <div
        id="el-07-cta"
        class="scene"
        data-composition-id="07-cta"
        data-composition-src="compositions/frames/07-cta.html"

        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.9, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-intro", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.9, ease: "power2.inOut" }, 4);
        tl.to("#el-02-intro", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.9, ease: "power2.inOut" }, 9);
        tl.fromTo("#el-03-ritual", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.9, ease: "power2.inOut" }, 9);
        tl.to("#el-03-ritual", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.9, ease: "power2.inOut" }, 14.5);
        tl.fromTo("#el-04-taste", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.9, ease: "power2.inOut" }, 14.5);
        tl.to("#el-04-taste", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.9, ease: "power2.inOut" }, 18.5);
        tl.fromTo("#el-05-ingredients", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.9, ease: "power2.inOut" }, 18.5);
        tl.to("#el-05-ingredients", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.9, ease: "power2.inOut" }, 24);
        tl.fromTo("#el-06-qualities", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.9, ease: "power2.inOut" }, 24);
        tl.to("#el-06-qualities", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.9, ease: "power2.inOut" }, 29);
        tl.fromTo("#el-07-cta", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.9, ease: "power2.inOut" }, 29);
        tl.to({}, { duration: 34 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
